<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B — The Drafting Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --desk: #CFC7B5; --paper: #F7F4ED; --ink: #121212; --blue: #2447D6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--desk); color: var(--ink); font: 400 15px/1.5 "Inter", sans-serif; cursor: crosshair; user-select: none; }
  .mono { font: 500 11px/1.5 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  header, footer { position: fixed; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: baseline; z-index: 30; pointer-events: none; }
  header { top: 20px; } footer { bottom: 20px; }
  header span { font: 400 24px "Instrument Serif", serif; }
  header a { color: var(--ink); text-decoration: underline; pointer-events: auto; }
  canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  /* the lamp: bright where the pointer is, dim everywhere else */
  .lamp { position: fixed; inset: 0; z-index: 20; pointer-events: none;
    background: radial-gradient(circle 46vmin at var(--mx, 50%) var(--my, 45%), rgba(255,244,214,.20) 0, rgba(18,18,18,0) 45%, rgba(18,18,18,.46) 100%); }

  .sheet { position: absolute; z-index: 2; width: 230px; height: 300px; padding: 20px; background: var(--paper); border: 0; text-align: left; color: var(--ink);
    display: flex; flex-direction: column; justify-content: space-between; cursor: grab; touch-action: none; font: inherit;
    transform: rotate(var(--r)) perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--sc, 1));
    box-shadow: var(--sx, 0px) var(--sy, 10px) var(--sb, 22px) rgba(30, 22, 8, .30);
    transition: transform .25s ease-out; }
  .sheet:active { cursor: grabbing; }
  .sheet .mono { color: var(--blue); }
  .sheet h2 { font: 400 40px/.95 "Instrument Serif", serif; letter-spacing: -.02em; }
  .sheet svg { width: 100%; height: 110px; }
  .sheet svg * { fill: none; stroke: var(--blue); stroke-width: 1; stroke-dasharray: 3 3; }
  .sheet p { font-size: 13px; color: #55524c; }
  .sheet:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }

  .sheet.open { z-index: 25 !important; cursor: default; left: 0 !important; top: 0 !important; width: 100vw; height: 100vh; padding: clamp(28px, 7vw, 90px);
    --r: 0deg !important; --rx: 0deg !important; --ry: 0deg !important; --sc: 1 !important; box-shadow: none; justify-content: center; gap: 18px;
    transition: left .7s cubic-bezier(.76,0,.24,1), top .7s cubic-bezier(.76,0,.24,1), width .7s cubic-bezier(.76,0,.24,1), height .7s cubic-bezier(.76,0,.24,1), transform .7s, padding .7s; }
  .sheet.closing { transition: left .6s cubic-bezier(.76,0,.24,1), top .6s cubic-bezier(.76,0,.24,1), width .6s cubic-bezier(.76,0,.24,1), height .6s cubic-bezier(.76,0,.24,1), transform .6s; z-index: 25 !important; }
  .sheet.open h2 { font-size: clamp(4rem, 14vw, 11rem); }
  .sheet.open svg { display: none; }
  .sheet.open p { font-size: 16px; max-width: 44ch; }
  .close { display: none; align-self: flex-start; border: 1px solid var(--ink); border-radius: 999px; padding: 12px 22px; font: 500 14px "Inter", sans-serif; cursor: pointer; }
  .close:hover { background: var(--ink); color: var(--paper); }
  .sheet.open .close { display: inline-block; }
  .sheet .more { display: none; }
  .sheet.open .more { display: block; }
  .sheet.open .less { display: none; }
</style>
</head>
<body>
<header><span>Nicho.dev</span><a class="mono" href="pc-build.html">← See concept A: PC Build</a></header>
<canvas id="ink"></canvas>
<div id="desk"></div>
<div class="lamp" id="lamp"></div>
<footer class="mono"><span>Move the lamp. Drag a sheet. Click one to open it.</span><span>Concept B — The Drafting Desk</span></footer>

<script>
const SHEETS = [
  { no: '01', title: 'Projects',       note: 'Three builds, each started as a sketch.', x: .16, y: .22, r: -7,
    svg: '<rect x="6" y="8" width="52" height="92" rx="6"/><rect x="72" y="20" width="52" height="92" rx="6"/><rect x="138" y="8" width="52" height="92" rx="6"/>' },
  { no: '02', title: 'About',          note: 'IT student in Davao City who designs first.', x: .40, y: .46, r: 4,
    svg: '<circle cx="46" cy="50" r="34"/><line x1="96" y1="30" x2="190" y2="30"/><line x1="96" y1="52" x2="190" y2="52"/><line x1="96" y1="74" x2="160" y2="74"/>' },
  { no: '03', title: 'Skills',         note: 'Web, mobile, desktop, databases and design.', x: .62, y: .16, r: 9,
    svg: '<rect x="6" y="60" width="26" height="44"/><rect x="44" y="40" width="26" height="64"/><rect x="82" y="50" width="26" height="54"/><rect x="120" y="22" width="26" height="82"/><rect x="158" y="8" width="26" height="96"/>' },
  { no: '04', title: 'Certifications', note: 'Three IT Specialist certificates.', x: .78, y: .50, r: -5,
    svg: '<rect x="6" y="10" width="184" height="90"/><circle cx="154" cy="70" r="20"/><line x1="22" y1="34" x2="110" y2="34"/><line x1="22" y1="54" x2="90" y2="54"/>' },
  { no: '05', title: 'Contact',        note: 'Let’s build something.', x: .10, y: .62, r: 6,
    svg: '<rect x="6" y="20" width="184" height="80"/><path d="M6 20 L98 70 L190 20"/>' }
];

const desk = document.getElementById('desk'), lamp = document.getElementById('lamp');
let mouse = { x: innerWidth / 2, y: innerHeight * .45 }, zTop = 5;

const sheets = SHEETS.map(s => {
  const el = document.createElement('div');
  el.className = 'sheet'; el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', `Open ${s.title}`);
  el.style.left = Math.max(12, Math.min(innerWidth - 242, s.x * innerWidth)) + 'px';
  el.style.top = Math.max(60, Math.min(innerHeight - 330, s.y * innerHeight)) + 'px';
  el.style.setProperty('--r', s.r + 'deg');
  el.innerHTML = `<span class="mono">Sheet ${s.no}</span><svg viewBox="0 0 196 110">${s.svg}</svg>
    <div><h2>${s.title}</h2><p class="less">${s.note}</p><p class="more">${s.note} In the real site, this sheet becomes the full ${s.title} page.</p></div>
    <button class="close">← Back to the desk</button>`;
  desk.append(el);
  let drag = null;
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('open')) return;
    el.setPointerCapture(e.pointerId); el.style.zIndex = ++zTop;
    drag = { dx: e.clientX - el.offsetLeft, dy: e.clientY - el.offsetTop, sx: e.clientX, sy: e.clientY, moved: false };
    el.style.setProperty('--sc', 1.04);
  });
  el.addEventListener('pointermove', e => {
    if (el.classList.contains('open')) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 14 + 'deg');
    el.style.setProperty('--rx', -((e.clientY - r.top) / r.height - .5) * 14 + 'deg');
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 5) drag.moved = true;
    el.style.left = e.clientX - drag.dx + 'px'; el.style.top = e.clientY - drag.dy + 'px';
  });
  el.addEventListener('pointerup', () => { const d = drag; drag = null; el.style.setProperty('--sc', 1); if (d && !d.moved) openSheet(el); });
  el.addEventListener('pointerleave', () => { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && !el.classList.contains('open')) openSheet(el); });
  el.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeSheet(el); });
  el.querySelector('.close').addEventListener('pointerdown', e => e.stopPropagation());
  return el;
});

function openSheet(el) { el.dataset.l = el.style.left; el.dataset.t = el.style.top; el.dataset.r = el.style.getPropertyValue('--r'); el.classList.add('open'); el.style.setProperty('--r', '0deg'); }
function closeSheet(el) {
  el.classList.add('closing'); el.classList.remove('open');
  el.style.left = el.dataset.l; el.style.top = el.dataset.t; el.style.setProperty('--r', el.dataset.r);
  setTimeout(() => el.classList.remove('closing'), 650);
}

/* lamp + shadows follow the pointer; a pencil line trails behind it and fades */
const cv = document.getElementById('ink'), ctx = cv.getContext('2d');
let pts = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', size); size();
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; pts.push({ x: e.clientX, y: e.clientY, t: performance.now() }); });

function frame(now) {
  lamp.style.setProperty('--mx', mouse.x + 'px'); lamp.style.setProperty('--my', mouse.y + 'px');
  sheets.forEach(el => {
    if (el.classList.contains('open')) return;
    const r = el.getBoundingClientRect();
    const dx = (r.left + r.width / 2 - mouse.x), dy = (r.top + r.height / 2 - mouse.y), d = Math.hypot(dx, dy) || 1;
    const len = Math.min(34, 6 + d * .045);
    el.style.setProperty('--sx', (dx / d * len).toFixed(1) + 'px');
    el.style.setProperty('--sy', (dy / d * len).toFixed(1) + 'px');
    el.style.setProperty('--sb', (14 + len * .9).toFixed(0) + 'px');
  });
  pts = pts.filter(p => now - p.t < 900);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.lineCap = 'round';
  for (let i = 1; i < pts.length; i++) {
    const a = 1 - (now - pts[i].t) / 900;
    ctx.strokeStyle = `rgba(36,71,214,${(a * .7).toFixed(2)})`; ctx.lineWidth = 1 + a * 1.2;
    ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
